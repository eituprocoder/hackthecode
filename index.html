<!-- No olvides vincular el manifest en el <head> -->
<link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --hacker-green: #00ff41;
            --hacker-cyan: #00f3ff;
            --hacker-amber: #ffb700;
            --dark-bg: #0d0d0d;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--dark-bg);
            color: var(--hacker-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container { width: 100%; max-width: 900px; text-align: center; position: relative; }
        .hidden { display: none !important; }
        
        /* Menu and Lobby */
        .card {
            border: 1px solid var(--hacker-green);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px var(--hacker-green);
            background: #000;
            border-radius: 4px;
        }
        input, button, textarea {
            background: black;
            color: var(--hacker-green);
            border: 1px solid var(--hacker-green);
            padding: 10px;
            margin: 5px;
            font-family: inherit;
        }
        button:hover { background: var(--hacker-green); color: black; cursor: pointer; }
        button:disabled { border-color: #555; color: #555; cursor: not-allowed; background: black; }

        /* Profile Badge */
        #profile-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            border: 1px solid var(--hacker-green);
            padding: 8px 12px;
            font-weight: bold;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Game Screen Layout */
        #rivals-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .rival-card { 
            border: 1px solid #ff4444; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
        }
        .eliminated { opacity: 0.3; text-decoration: line-through; border-color: gray; pointer-events: none; }
        .ready-text { color: var(--hacker-amber); font-size: 0.85em; }

        /* Single Feedback Display */
        .feedback-box {
            margin-top: 10px;
            background: #111;
            border: 1px dashed var(--hacker-green);
            padding: 8px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            text-align: center;
        }
        .feedback-row {
            letter-spacing: 2px;
            font-weight: bold;
        }

        /* Skill Button */
        .recode-btn {
            border-color: var(--hacker-amber) !important;
            color: var(--hacker-amber) !important;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .recode-btn:hover:not(:disabled) {
            background: var(--hacker-amber) !important;
            color: black !important;
            box-shadow: 0 0 10px var(--hacker-amber);
        }

        /* Notebook Section */
        .notebook-card {
            border: 1px solid var(--hacker-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            text-align: left;
            margin-bottom: 20px;
        }
        .notebook-card h4 {
            margin: 0 0 10px 0;
            color: var(--hacker-cyan);
        }
        .scratchpad-digits {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }
        .digit-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-color: var(--hacker-cyan);
            color: var(--hacker-cyan);
            font-weight: bold;
        }
        .digit-btn.struck {
            background: #333;
            color: #777;
            border-color: #555;
            text-decoration: line-through;
        }
        #notebook-textarea {
            width: 100%;
            height: 90px;
            resize: vertical;
            border-color: var(--hacker-cyan);
            color: var(--hacker-cyan);
            font-size: 0.85em;
        }

        /* Chat */
        #chat-box {
            height: 140px;
            overflow-y: auto;
            border: 1px solid var(--hacker-green);
            text-align: left;
            padding: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        /* Modals & Overlays */
        #tutorial-modal, #recode-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            max-width: 420px;
            width: 92%;
            background: #000;
            border-color: var(--hacker-cyan);
            box-shadow: 0 0 25px var(--hacker-cyan);
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 999;
        }
    </style>
</head>
<body>

<div id="profile-badge">🏆 Trophies: <span id="trophy-count">0</span></div>

<div class="container">
    <h1>&gt; HACK THE CODE _</h1>

    <button onclick="openTutorial()" style="margin-bottom: 15px; border-color: var(--hacker-cyan); color: var(--hacker-cyan);">📖 How to Play?</button>

    <!-- Main Menu -->
    <div id="menu" class="card">
        <input type="text" id="username" placeholder="Enter Hacker Alias">
        <br>
        <button onclick="hostGame()">Create Game</button>
        <br><br>
        <input type="text" id="join-id" placeholder="Room ID">
        <button onclick="joinGame()">Join Room</button>
    </div>

    <!-- Lobby -->
    <div id="lobby" class="card hidden">
        <h3>ROOM ID: <span id="display-id" style="color: white; user-select: all;"></span></h3>
        
        <div id="qr-container" style="margin: 15px 0;"></div>

        <p>Your Secret Code (6 digits): 
            <input type="password" id="my-secret-code" maxlength="6" pattern="\d{6}" placeholder="123456" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </p>
        <button id="ready-btn" onclick="toggleReady()">I'M READY</button>
        
        <div id="player-list" style="margin-top: 20px; text-align: left;"></div>
    </div>

    <!-- Active Game Screen -->
    <div id="game-screen" class="hidden">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
                <h4 style="margin:0;">YOUR CODE: <span id="show-my-code" style="color: white; letter-spacing: 2px;">******</span></h4>
            </div>
            <div>
                <button id="recode-btn" class="recode-btn" onclick="openRecodeModal()">⚡ RECODE (READY)</button>
            </div>
        </div>

        <!-- Rivals Grid -->
        <div id="rivals-list"></div>

        <!-- Hacker Notebook -->
        <div class="card notebook-card">
            <h4>📓 HACKER NOTEBOOK &amp; SCRATCHPAD</h4>
            <div style="font-size:0.8em; margin-bottom: 6px; color: gray;">Click digits to cross off eliminated numbers:</div>
            <div class="scratchpad-digits" id="scratchpad">
                <!-- Generated dynamically -->
            </div>
            <textarea id="notebook-textarea" placeholder="Type candidate codes, logic notes, or rival patterns here..."></textarea>
        </div>
    </div>

    <!-- Victory Screen -->
    <div id="victory-screen" class="card hidden" style="border-color: gold; box-shadow: 0 0 20px gold;">
        <h2 id="victory-text" style="color: gold;"></h2>
        <button id="btn-play-again" class="hidden" onclick="playAgain()">Play Again</button>
        <button onclick="location.reload()">Exit to Main Menu</button>
    </div>

    <!-- Chat Box -->
    <div id="chat-container" class="hidden" style="width: 100%;">
        <div id="chat-box"></div>
        <input type="text" id="chat-input" placeholder="Send transmission..." style="width: 70%;">
        <button onclick="sendChatMessage()">Send</button>
    </div>
</div>

<!-- Modal Overlays -->
<div id="modal-overlay" class="modal-overlay hidden"></div>

<!-- Tutorial Modal -->
<div id="tutorial-modal" class="card hidden">
    <h3 style="color: var(--hacker-cyan);">TUTORIAL (<span id="tut-step">1</span>/8)</h3>
    <p id="tut-text" style="min-height: 70px; font-size: 0.9em; text-align: left;"></p>
    <button onclick="nextTutorial()">Next</button>
    <button onclick="closeTutorial()" style="border-color: #ff4444; color: #ff4444;">Close</button>
</div>

<!-- Recode Skill Modal -->
<div id="recode-modal" class="card hidden">
    <h3 style="color: var(--hacker-amber);">⚡ RECODE SKILL</h3>
    <p style="font-size: 0.85em;">Enter your new 6-digit secret code. This will update your encrypted code immediately!</p>
    <input type="password" id="new-secret-code" maxlength="6" pattern="\d{6}" placeholder="New 6 digits" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
    <br><br>
    <button onclick="confirmRecode()" style="border-color: var(--hacker-amber); color: var(--hacker-amber);">CONFIRM RECODE</button>
    <button onclick="closeRecodeModal()" style="border-color: gray; color: gray;">Cancel</button>
</div>

<script>
    // --- SFX AUDIO ENGINE (WEB AUDIO API) ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type, duration, vol=0.1) {
        try {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function sfxClick() { initAudio(); playTone(600, 'sine', 0.1, 0.05); }
    function sfxHack() { initAudio(); playTone(400, 'sawtooth', 0.15, 0.05); }
    function sfxHit() { initAudio(); playTone(1000, 'sine', 0.1, 0.1); setTimeout(()=>playTone(1500, 'sine', 0.2, 0.1), 100); }
    function sfxMiss() { initAudio(); playTone(200, 'sawtooth', 0.3, 0.1); }
    function sfxEliminated() { initAudio(); playTone(300, 'square', 0.5, 0.1); setTimeout(()=>playTone(200, 'square', 0.5, 0.1), 250); }
    function sfxWin() { initAudio(); [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.1), i*150)); }

    document.addEventListener('click', (e) => { if(e.target.tagName === 'BUTTON') sfxClick(); });

    // --- TUTORIAL ENGINE ---
    const tutSteps = [
        "Welcome to Hack the Code! Your intellect is your sharpest exploit.",
        "The objective is to decrypt and breach your rivals' secret 6-digit codes before they breach yours.",
        "To begin, create a room as 'Host' or enter a 'Room ID' to join an existing simulation.",
        "Once in the lobby, set your secret 6-digit code. Keep it strictly classified!",
        "When all hackers are marked READY, the game begins and rivals will appear on your grid.",
        "Enter a 6-digit guess into a rival's hack panel and press 'HACK'.",
        "Feedback Guide:\n✅ = Digit is correct and in the right position.\n⚠️ = Digit exists in rival's code, but in a DIFFERENT position.\n❌ = Digit is NOT in rival's code.",
        "Special Features:\n⚡ RECODE: Change your secret code every 30 seconds!\n📓 NOTEBOOK: Track scratchpad numbers and write logic notes."
    ];
    let currentTutStep = 0;
    function openTutorial() {
        currentTutStep = 0;
        document.getElementById('tutorial-modal').classList.remove('hidden');
        document.getElementById('modal-overlay').classList.remove('hidden');
        updateTutorial();
    }
    function nextTutorial() {
        currentTutStep++;
        if(currentTutStep >= tutSteps.length) closeTutorial();
        else updateTutorial();
    }
    function updateTutorial() {
        document.getElementById('tut-step').innerText = currentTutStep + 1;
        document.getElementById('tut-text').innerText = tutSteps[currentTutStep];
    }
    function closeTutorial() {
        document.getElementById('tutorial-modal').classList.add('hidden');
        document.getElementById('modal-overlay').classList.add('hidden');
    }

    // --- GAME STATE ---
    let peer;
    let conn; 
    let connections = []; 
    let myId;
    let isHost = false;
    let myData = { name: '', code: '', ready: false, eliminated: false };
    let players = [];
    let trophies = parseInt(localStorage.getItem('hackTheCode_trophies')) || 0;
    
    // Skill state
    let recodeCooldown = 0;
    let recodeInterval = null;

    document.getElementById('trophy-count').innerText = trophies;

    // --- PEERJS NETWORKING ---

    function hostGame() {
        const nameInput = document.getElementById('username').value.trim();
        if (!nameInput) return alert("Please enter your hacker alias first.");
        
        myData.name = nameInput;
        isHost = true;
        initPeer();
        
        peer.on('open', (id) => {
            myId = id;
            document.getElementById('display-id').innerText = id;
            document.getElementById('qr-container').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${id}&color=00ff41&bgcolor=000" alt="QR Room Code">`;
            showLobby();
            addOrUpdatePlayer({ id: myId, name: myData.name, ready: false, eliminated: false });
        });

        peer.on('connection', (c) => {
            if (players.length >= 10) {
                c.send({ type: 'ERROR', msg: 'Room is full (Maximum 10 players).' });
                setTimeout(() => c.close(), 500);
                return;
            }
            
            c.on('data', (data) => handleData(data, c));
            c.on('open', () => {
                connections.push(c);
            });
            c.on('close', () => {
                players = players.filter(p => p.id !== c.peer);
                connections = connections.filter(conn => conn.peer !== c.peer);
                broadcast({ type: 'PLAYER_LIST', list: players });
                updatePlayerListUI();
                checkAllReady();
            });
        });
    }

    function joinGame() {
        const nameInput = document.getElementById('username').value.trim();
        const hostId = document.getElementById('join-id').value.trim();
        
        if (!nameInput) return alert("Please enter your hacker alias first.");
        if (!hostId) return alert("Please enter the Room ID.");
        
        myData.name = nameInput;
        initPeer();
        
        peer.on('open', (id) => {
            myId = id;
            conn = peer.connect(hostId);
            
            conn.on('open', () => {
                conn.send({ type: 'JOIN', id: myId, name: myData.name });
                document.getElementById('display-id').innerText = hostId;
                showLobby();
            });
            
            conn.on('data', (data) => handleData(data, conn));
            conn.on('close', () => alert("Connection to Host lost."));
            conn.on('error', () => alert("Error connecting to room."));
        });
    }

    function initPeer() {
        peer = new Peer();
        peer.on('error', (err) => alert("Connection error: " + err.type));
    }

    function showLobby() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('lobby').classList.remove('hidden');
    }

    // --- DATA HANDLING ---

    function handleData(data, connection) {
        switch(data.type) {
            case 'ERROR':
                alert(data.msg);
                location.reload();
                break;
            case 'JOIN': 
                addOrUpdatePlayer({ id: data.id, name: data.name, ready: false, eliminated: false });
                broadcast({ type: 'PLAYER_LIST', list: players });
                break;
            case 'PLAYER_LIST': 
                players = data.list;
                updatePlayerListUI();
                break;
            case 'READY': 
                let p = players.find(player => player.id === data.id);
                if (p) {
                    p.ready = data.ready;
                    broadcast({ type: 'PLAYER_LIST', list: players });
                    updatePlayerListUI();
                    checkAllReady();
                }
                break;
            case 'START_GAME':
                players = data.list;
                runGameStart();
                break;
            case 'GUESS':
                // Received attack: evaluate against current myData.code
                if (data.to === myId) {
                    let secret = myData.code.split('');
                    let guess = data.val.split('');
                    let resultArr = new Array(6).fill('❌');
                    let secretUsed = new Array(6).fill(false);
                    let guessUsed = new Array(6).fill(false);
                    let isCorrect = true;

                    // Pass 1: Exact positional matches (✅)
                    for (let i = 0; i < 6; i++) {
                        if (guess[i] === secret[i]) {
                            resultArr[i] = '✅';
                            secretUsed[i] = true;
                            guessUsed[i] = true;
                        } else {
                            isCorrect = false;
                        }
                    }

                    // Pass 2: Position mismatch (⚠️) - digit exists elsewhere in code
                    for (let i = 0; i < 6; i++) {
                        if (!guessUsed[i]) {
                            for (let j = 0; j < 6; j++) {
                                if (!secretUsed[j] && guess[i] === secret[j]) {
                                    resultArr[i] = '⚠️';
                                    secretUsed[j] = true;
                                    break;
                                }
                            }
                        }
                    }

                    // Send result back to attacker
                    let feedbackData = { type: 'GUESS_RESULT', from: myId, to: data.from, guess: data.val, result: resultArr };
                    
                    if (isHost) {
                        let attackerConn = connections.find(c => c.peer === data.from);
                        if (attackerConn) attackerConn.send(feedbackData);
                    } else {
                        conn.send(feedbackData);
                    }

                    if (isCorrect && !myData.eliminated) {
                        sfxEliminated();
                        alert("CRITICAL BREACH! Your secret code has been cracked. You are eliminated!");
                        myData.eliminated = true;
                        if (isHost) {
                            markEliminated(myId);
                            broadcast({ type: 'ELIMINATED', playerId: myId });
                            checkWinCondition();
                        } else {
                            conn.send({ type: 'ELIMINATED', playerId: myId });
                        }
                    }
                } else if (isHost) { 
                    // Host routes attack to targeted rival
                    let targetConn = connections.find(c => c.peer === data.to);
                    if (targetConn) targetConn.send(data);
                }
                break;
            case 'GUESS_RESULT':
                if (data.to === myId) {
                    handleFeedback(data);
                } else if (isHost) {
                    let attackerConn = connections.find(c => c.peer === data.to);
                    if (attackerConn) attackerConn.send(data);
                }
                break;
            case 'ELIMINATED':
                markEliminated(data.playerId);
                checkWinCondition();
                break;
            case 'CHAT':
                displayChat(data.name, data.msg);
                break;
            case 'GAME_OVER':
                showVictory(data.winnerId, data.winnerName);
                break;
            case 'RESET':
                resetToLobby();
                break;
        }
    }

    // --- LOBBY LOGIC ---

    function toggleReady() {
        const codeInput = document.getElementById('my-secret-code').value;
        if (codeInput.length !== 6) return alert("Your code must be exactly 6 digits.");
        
        myData.code = codeInput;
        myData.ready = true;
        
        document.getElementById('ready-btn').innerText = "WAITING FOR OTHERS...";
        document.getElementById('ready-btn').disabled = true;
        document.getElementById('my-secret-code').disabled = true;

        if (isHost) {
            let self = players.find(p => p.id === myId);
            self.ready = true;
            broadcast({ type: 'PLAYER_LIST', list: players });
            updatePlayerListUI();
            checkAllReady();
        } else {
            conn.send({ type: 'READY', id: myId, ready: true });
        }
    }

    function checkAllReady() {
        if (!isHost) return;
        if (players.length < 2) return; 
        
        const allReady = players.every(p => p.ready);
        if (allReady) {
            broadcast({ type: 'START_GAME', list: players });
            runGameStart();
        }
    }

    // --- GAMEPLAY ENGINE ---

    function runGameStart() {
        initAudio();
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('chat-container').classList.remove('hidden');
        
        document.getElementById('show-my-code').innerText = myData.code;
        myData.eliminated = false;
        
        setupScratchpad();
        initRecodeSkill();
        renderRivals();
    }

    function renderRivals() {
        const list = document.getElementById('rivals-list');
        list.innerHTML = '';
        players.forEach(p => {
            if (p.id === myId) return;
            const div = document.createElement('div');
            div.id = `player-${p.id}`;
            div.className = 'rival-card card';
            div.innerHTML = `
                <p style="margin-top:0;"><strong>&gt; ${p.name}</strong></p>
                <input type="text" id="guess-${p.id}" maxlength="6" pattern="\\d{6}" placeholder="6-DIGIT CODE" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <button onclick="sendGuess('${p.id}')">HACK</button>
                <div id="feedback-${p.id}" class="feedback-box">
                    <span style="color: gray; font-size: 0.85em;">No attempts yet</span>
                </div>`;
            list.appendChild(div);
        });
    }

    function sendGuess(targetId) {
        sfxHack();
        if (myData.eliminated) return alert("You are eliminated and cannot hack.");
        
        const guessInput = document.getElementById(`guess-${targetId}`);
        const guess = guessInput.value;
        
        if (guess.length !== 6) return alert("You must enter a 6-digit code attempt.");

        if (isHost) {
            let targetConn = connections.find(c => c.peer === targetId);
            if (targetConn) targetConn.send({ type: 'GUESS', from: myId, to: targetId, val: guess });
        } else {
            conn.send({ type: 'GUESS', from: myId, to: targetId, val: guess });
        }
        guessInput.value = '';
    }

    function handleFeedback(data) {
        if (data.result.includes('✅') || data.result.includes('⚠️')) sfxHit();
        else sfxMiss();

        const feedbackDiv = document.getElementById(`feedback-${data.from}`);
        if (feedbackDiv) {
            // ONLY show the current/latest guess attempt
            feedbackDiv.innerHTML = `<div class="feedback-row">${data.guess} ➔ ${data.result.join('')}</div>`;
        }
    }

    function markEliminated(id) {
        let p = players.find(player => player.id === id);
        if (p) p.eliminated = true;

        const el = document.getElementById(`player-${id}`);
        if (el) {
            el.classList.add('eliminated');
            const btn = el.querySelector('button');
            const inp = el.querySelector('input');
            if (btn) btn.disabled = true;
            if (inp) inp.disabled = true;
        }
        
        if (id === myId) {
            document.getElementById('show-my-code').innerText += " (ELIMINATED)";
            document.getElementById('show-my-code').style.color = "#ff4444";
        }
    }

    function checkWinCondition() {
        if (!isHost) return;

        const activePlayers = players.filter(p => !p.eliminated);
        if (activePlayers.length === 1) {
            const winner = activePlayers[0];
            showVictory(winner.id, winner.name);
            broadcast({ type: 'GAME_OVER', winnerId: winner.id, winnerName: winner.name });
        } else if (activePlayers.length === 0) {
            showVictory(null, "No one");
            broadcast({ type: 'GAME_OVER', winnerId: null, winnerName: "No one" });
        }
    }

    function showVictory(winnerId, winnerName) {
        sfxWin();

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('victory-screen').classList.remove('hidden');
        
        const vicText = document.getElementById('victory-text');
        
        if (winnerId === myId) {
            vicText.innerText = "YOU ARE THE TOP HACKER! VICTORY ACHIEVED!";
            addTrophy();
        } else {
            vicText.innerText = `VICTORIOUS HACKER: ${winnerName}`;
        }

        if (isHost) {
            document.getElementById('btn-play-again').classList.remove('hidden');
        }
    }

    function addTrophy() {
        trophies++;
        localStorage.setItem('hackTheCode_trophies', trophies);
        document.getElementById('trophy-count').innerText = trophies;
    }

    // --- RECODE SKILL ENGINE ---

    function initRecodeSkill() {
        recodeCooldown = 0;
        updateRecodeButton();
    }

    function openRecodeModal() {
        if (recodeCooldown > 0) return;
        if (myData.eliminated) return alert("You are eliminated and cannot use skills.");
        
        document.getElementById('new-secret-code').value = '';
        document.getElementById('recode-modal').classList.remove('hidden');
        document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeRecodeModal() {
        document.getElementById('recode-modal').classList.add('hidden');
        document.getElementById('modal-overlay').classList.add('hidden');
    }

    function confirmRecode() {
        const newCode = document.getElementById('new-secret-code').value.trim();
        if (newCode.length !== 6) return alert("New code must be exactly 6 digits.");

        myData.code = newCode;
        document.getElementById('show-my-code').innerText = myData.code;
        sfxHack();
        closeRecodeModal();

        // Start 30s Cooldown
        recodeCooldown = 30;
        updateRecodeButton();

        if (recodeInterval) clearInterval(recodeInterval);
        recodeInterval = setInterval(() => {
            recodeCooldown--;
            updateRecodeButton();
            if (recodeCooldown <= 0) {
                clearInterval(recodeInterval);
            }
        }, 1000);
    }

    function updateRecodeButton() {
        const btn = document.getElementById('recode-btn');
        if (!btn) return;
        if (recodeCooldown > 0) {
            btn.innerText = `⚡ RECODE (${recodeCooldown}s)`;
            btn.disabled = true;
        } else {
            btn.innerText = "⚡ RECODE (READY)";
            btn.disabled = false;
        }
    }

    // --- NOTEBOOK & SCRATCHPAD ---

    function setupScratchpad() {
        const pad = document.getElementById('scratchpad');
        pad.innerHTML = '';
        for (let i = 0; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = 'digit-btn';
            btn.innerText = i;
            btn.onclick = () => btn.classList.toggle('struck');
            pad.appendChild(btn);
        }
    }

    // --- RESTART GAME ---

    function playAgain() {
        if (!isHost) return;
        broadcast({ type: 'RESET' });
        resetToLobby();
    }

    function resetToLobby() {
        document.getElementById('victory-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('lobby').classList.remove('hidden');
        
        document.getElementById('my-secret-code').value = '';
        document.getElementById('my-secret-code').disabled = false;
        document.getElementById('ready-btn').innerText = "I'M READY";
        document.getElementById('ready-btn').disabled = false;
        document.getElementById('show-my-code').style.color = "white";
        document.getElementById('chat-box').innerHTML = '';

        if (recodeInterval) clearInterval(recodeInterval);

        myData.ready = false;
        myData.eliminated = false;
        players.forEach(p => {
            p.ready = false;
            p.eliminated = false;
        });

        updatePlayerListUI();
    }

    // --- HELPER FUNCTIONS ---

    function broadcast(data) {
        connections.forEach(c => c.send(data));
    }

    function updatePlayerListUI() {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p => {
            let status = p.ready ? "<span class='ready-text'>[READY]</span>" : "[Waiting...]";
            return `<div>&gt; ${p.name} ${status}</div>`;
        }).join('');
    }

    function addOrUpdatePlayer(newPlayer) {
        let existing = players.find(p => p.id === newPlayer.id);
        if (existing) {
            existing.name = newPlayer.name;
            existing.ready = newPlayer.ready;
        } else {
            players.push(newPlayer);
        }
        updatePlayerListUI();
    }

    function sendChatMessage() {
        const msg = document.getElementById('chat-input').value.trim();
        if (!msg) return;
        
        const data = { type: 'CHAT', name: myData.name, msg: msg };
        displayChat("You", msg);
        
        if (isHost) broadcast(data);
        else conn.send(data);
        
        document.getElementById('chat-input').value = '';
    }

    function displayChat(name, msg) {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div><strong>${name}:</strong> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
