<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack the Code</title>
    <script>
    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker registrado correctamente'))
      .catch(err => console.log('Error al registrar:', err));
  }
</script>

<!-- No olvides vincular el manifest en el <head> -->
<link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --hacker-green: #00ff41;
            --dark-bg: #0d0d0d;
        }
        body {
            background-color: var(--dark-bg);
            color: var(--hacker-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container { width: 100%; max-width: 800px; text-align: center; position: relative; }
        .hidden { display: none !important; }
        
        /* Menu & Lobby */
        .card {
            border: 1px solid var(--hacker-green);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px var(--hacker-green);
            background: #000;
        }
        input, button {
            background: black;
            color: var(--hacker-green);
            border: 1px solid var(--hacker-green);
            padding: 10px;
            margin: 5px;
        }
        button:hover { background: var(--hacker-green); color: black; cursor: pointer; }
        button:disabled { border-color: gray; color: gray; cursor: not-allowed; }

        /* Profile */
        #profile-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            border: 1px solid var(--hacker-green);
            padding: 10px;
            font-weight: bold;
        }

        /* Game Screen */
        #rivals-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .rival-card { border: 1px solid red; padding: 10px; display: flex; flex-direction: column; }
        .eliminated { opacity: 0.3; text-decoration: line-through; border-color: gray; pointer-events: none; }
        .ready-text { color: yellow; font-size: 0.8em; }

        /* Feedback Table */
        .feedback-table {
            margin-top: 10px;
            background: #111;
            border: 1px dashed var(--hacker-green);
            padding: 5px;
            height: 80px;
            overflow-y: auto;
            font-size: 0.9em;
            text-align: center;
        }
        .feedback-row {
            letter-spacing: 2px;
            margin-bottom: 3px;
        }

        /* Chat */
        #chat-box {
            height: 150px;
            overflow-y: scroll;
            border: 1px solid var(--hacker-green);
            text-align: left;
            padding: 10px;
            margin-top: 20px;
        }

        /* Tutorial Modal */
        #tutorial-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            max-width: 400px;
            width: 90%;
            border-color: cyan;
            box-shadow: 0 0 20px cyan;
        }
        #tutorial-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 999;
        }
    </style>
</head>
<body>

<audio id="bg-music" loop></audio>

<div id="profile-badge">🏆 Trophies: <span id="trophy-count">0</span></div>

<div class="container">
    <h1>> HACK THE CODE _</h1>

    <button onclick="openTutorial()" style="margin-bottom: 15px; border-color: cyan; color: cyan;">📖 How to play?</button>

    <div id="menu" class="card">
        <input type="text" id="username" placeholder="Your Hacker Name">
        <br>
        <button onclick="hostGame()">Create Game</button>
        <br><br>
        <input type="text" id="join-id" placeholder="Room ID">
        <button onclick="joinGame()">Join Game</button>
    </div>

    <div id="lobby" class="card hidden">
        <h3>ROOM ID: <span id="display-id" style="color: white; user-select: all;"></span></h3>
        
        <div id="qr-container" style="margin: 15px 0;"></div>

        <div id="host-controls" class="hidden" style="margin: 15px 0; border: 1px dashed gray; padding: 10px;">
            <p>🎵 Host: Choose Music (Optional)</p>
            <input type="file" id="music-file" accept="audio/*" class="hidden">
            <button onclick="document.getElementById('music-file').click()">Upload MP3/WAV</button>
            <br><span id="music-name" style="font-size: 0.8em; color: gray;">None</span>
        </div>
        <p id="client-music-status" style="color: cyan; font-size: 0.8em;"></p>

        <p>Your Code (6 numbers): 
            <input type="password" id="my-secret-code" maxlength="6" pattern="\d{6}" placeholder="123456" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </p>
        <button id="ready-btn" onclick="toggleReady()">I AM READY</button>
        
        <div id="player-list" style="margin-top: 20px; text-align: left;"></div>
    </div>

    <div id="game-screen" class="hidden">
        <div class="card">
            <h4>YOUR CODE: <span id="show-my-code" style="color: white;"></span></h4>
        </div>
        <div id="rivals-list"></div>
    </div>

    <div id="victory-screen" class="card hidden" style="border-color: gold; box-shadow: 0 0 15px gold;">
        <h2 id="victory-text" style="color: gold;"></h2>
        <button id="btn-play-again" class="hidden" onclick="playAgain()">Keep Playing</button>
        <button onclick="location.reload()">Quit</button>
    </div>

    <div id="chat-container" class="hidden" style="width: 100%;">
        <div id="chat-box"></div>
        <input type="text" id="chat-input" placeholder="Message..." style="width: 75%;">
        <button onclick="sendChatMessage()">Send</button>
    </div>
</div>

<div id="tutorial-overlay" class="hidden"></div>
<div id="tutorial-modal" class="card hidden">
    <h3 style="color: cyan;">TUTORIAL (<span id="tut-step">1</span>/8)</h3>
    <p id="tut-text" style="min-height: 60px;">Welcome to Hack the Code, the game where your mind is your greatest weapon.</p>
    <button onclick="nextTutorial()">Next</button>
    <button onclick="closeTutorial()" style="border-color: red; color: red;">Close</button>
</div>

<script>
    // --- SFX ENGINE (WEB AUDIO API) ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function playTone(freq, type, duration, vol=0.1) {
        try {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }
    function sfxClick() { initAudio(); playTone(600, 'sine', 0.1, 0.05); }
    function sfxHack() { initAudio(); playTone(400, 'sawtooth', 0.15, 0.05); }
    function sfxHit() { initAudio(); playTone(1000, 'sine', 0.1, 0.1); setTimeout(()=>playTone(1500, 'sine', 0.2, 0.1), 100); }
    function sfxMiss() { initAudio(); playTone(200, 'sawtooth', 0.3, 0.1); }
    function sfxEliminated() { initAudio(); playTone(300, 'square', 0.5, 0.1); setTimeout(()=>playTone(200, 'square', 0.5, 0.1), 250); }
    function sfxWin() { initAudio(); [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.3, 0.1), i*150)); }

    // Intercept clicks for button SFX
    document.addEventListener('click', (e) => { if(e.target.tagName === 'BUTTON') sfxClick(); });

    // --- TUTORIAL LOGIC ---
    const tutSteps = [
        "Welcome to Hack the Code, the game where your mind is your greatest weapon.",
        "The objective is to figure out and crack your rivals' secret codes before they crack yours.",
        "To start, create a game as 'Host' or join one with a 'Room ID'.",
        "Once in the lobby, choose your 6-digit secret code. Keep it secret from everyone!",
        "When all players are ready, the game will begin. You'll see your rivals on the screen.",
        "Type a 6-digit code in a rival's panel and press 'HACK'.",
        "You will get feedback: '✅' means correct number in the correct position. '❌' means incorrect.",
        "Use logic to crack their codes. The last hacker standing wins!"
    ];
    let currentTutStep = 0;
    function openTutorial() {
        currentTutStep = 0;
        document.getElementById('tutorial-modal').classList.remove('hidden');
        document.getElementById('tutorial-overlay').classList.remove('hidden');
        updateTutorial();
    }
    function nextTutorial() {
        currentTutStep++;
        if(currentTutStep >= tutSteps.length) closeTutorial();
        else updateTutorial();
    }
    function updateTutorial() {
        document.getElementById('tut-step').innerText = currentTutStep + 1;
        document.getElementById('tut-text').innerText = tutSteps[currentTutStep];
    }
    function closeTutorial() {
        document.getElementById('tutorial-modal').classList.add('hidden');
        document.getElementById('tutorial-overlay').classList.add('hidden');
    }

    // --- GAME VARIABLES ---
    let peer;
    let conn; 
    let connections = []; 
    let myId;
    let isHost = false;
    let myData = { name: '', code: '', ready: false, eliminated: false };
    let players = [];
    let trophies = parseInt(localStorage.getItem('hackTheCode_trophies')) || 0;
    
    // Shared Music
    let sharedMusicData = null;
    let sharedMusicName = "";

    document.getElementById('trophy-count').innerText = trophies;

    // Music Reader (Host only)
    document.getElementById('music-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('music-name').innerText = file.name;
        sharedMusicName = file.name;
        const reader = new FileReader();
        reader.onload = function(evt) {
            sharedMusicData = evt.target.result;
            broadcast({ type: 'MUSIC', data: sharedMusicData, name: sharedMusicName });
        };
        reader.readAsDataURL(file);
    });

    // --- CONNECTION LOGIC ---

    function hostGame() {
        const nameInput = document.getElementById('username').value.trim();
        if (!nameInput) return alert("Please enter your name first.");
        
        myData.name = nameInput;
        isHost = true;
        initPeer();
        
        peer.on('open', (id) => {
            myId = id;
            document.getElementById('display-id').innerText = id;
            // Generate QR Code
            document.getElementById('qr-container').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${id}&color=00ff41&bgcolor=000" alt="Room QR Code">`;
            document.getElementById('host-controls').classList.remove('hidden');
            showLobby();
            addOrUpdatePlayer({ id: myId, name: myData.name, ready: false, eliminated: false });
        });

        peer.on('connection', (c) => {
            if (players.length >= 10) {
                c.send({ type: 'ERROR', msg: 'The room is full (Maximum 10 players)' });
                setTimeout(() => c.close(), 500);
                return;
            }
            
            c.on('data', (data) => handleData(data, c));
            c.on('open', () => {
                connections.push(c);
                // If Host has uploaded music, send it to the new player
                if (sharedMusicData) {
                    c.send({ type: 'MUSIC', data: sharedMusicData, name: sharedMusicName });
                }
            });
            c.on('close', () => {
                players = players.filter(p => p.id !== c.peer);
                connections = connections.filter(conn => conn.peer !== c.peer);
                broadcast({ type: 'PLAYER_LIST', list: players });
                updatePlayerListUI();
                checkAllReady();
            });
        });
    }

    function joinGame() {
        const nameInput = document.getElementById('username').value.trim();
        const hostId = document.getElementById('join-id').value.trim();
        
        if (!nameInput) return alert("Please enter your name first.");
        if (!hostId) return alert("Please enter the room ID.");
        
        myData.name = nameInput;
        initPeer();
        
        peer.on('open', (id) => {
            myId = id;
            conn = peer.connect(hostId);
            
            conn.on('open', () => {
                conn.send({ type: 'JOIN', id: myId, name: myData.name });
                document.getElementById('display-id').innerText = hostId;
                showLobby();
            });
            
            conn.on('data', (data) => handleData(data, conn));
            conn.on('close', () => alert("Connection to host lost."));
            conn.on('error', () => alert("Error connecting to the room."));
        });
    }

    function initPeer() {
        peer = new Peer();
        peer.on('error', (err) => alert("Connection error: " + err.type));
    }

    function showLobby() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('lobby').classList.remove('hidden');
    }

    // --- DATA HANDLING ---

    function handleData(data, connection) {
        switch(data.type) {
            case 'ERROR':
                alert(data.msg);
                location.reload();
                break;
            case 'JOIN': 
                addOrUpdatePlayer({ id: data.id, name: data.name, ready: false, eliminated: false });
                broadcast({ type: 'PLAYER_LIST', list: players });
                break;
            case 'PLAYER_LIST': 
                players = data.list;
                updatePlayerListUI();
                break;
            case 'MUSIC':
                document.getElementById('bg-music').src = data.data;
                document.getElementById('client-music-status').innerText = "🎵 Host's song is ready: " + data.name;
                break;
            case 'READY': 
                let p = players.find(player => player.id === data.id);
                if (p) {
                    p.ready = data.ready;
                    broadcast({ type: 'PLAYER_LIST', list: players });
                    updatePlayerListUI();
                    checkAllReady();
                }
                break;
            case 'START_GAME':
                players = data.list;
                runGameStart();
                break;
            case 'GUESS':
                // Check code on targeted guest player
                if (data.to === myId) {
                    let resultArr = [];
                    let isCorrect = true;
                    for (let i = 0; i < 6; i++) {
                        if (data.val[i] === myData.code[i]) { resultArr.push('✅'); } 
                        else { resultArr.push('❌'); isCorrect = false; }
                    }

                    // Send feedback response to attacker
                    let feedbackData = { type: 'GUESS_RESULT', from: myId, to: data.from, guess: data.val, result: resultArr };
                    
                    if (isHost) {
                        let attackerConn = connections.find(c => c.peer === data.from);
                        if (attackerConn) attackerConn.send(feedbackData);
                    } else {
                        conn.send(feedbackData);
                    }

                    if (isCorrect && !myData.eliminated) {
                        sfxEliminated();
                        alert("CRITICAL! Your code was cracked. You have been eliminated.");
                        myData.eliminated = true;
                        if (isHost) {
                            markEliminated(myId);
                            broadcast({ type: 'ELIMINATED', playerId: myId });
                            checkWinCondition();
                        } else {
                            conn.send({ type: 'ELIMINATED', playerId: myId });
                        }
                    }
                } else if (isHost) { 
                    // Host routes game query back to original attacker
                    let targetConn = connections.find(c => c.peer === data.to);
                    if (targetConn) targetConn.send(data);
                }
                break;
            case 'GUESS_RESULT':
                // Get result feedback of our own guess
                if (data.to === myId) {
                    handleFeedback(data);
                } else if (isHost) {
                    // Host handles routing result to correct source
                    let attackerConn = connections.find(c => c.peer === data.to);
                    if (attackerConn) attackerConn.send(data);
                }
                break;
            case 'ELIMINATED':
                markEliminated(data.playerId);
                checkWinCondition();
                break;
            case 'CHAT':
                displayChat(data.name, data.msg);
                break;
            case 'GAME_OVER':
                showVictory(data.winnerId, data.winnerName);
                break;
            case 'RESET':
                resetToLobby();
                break;
        }
    }

    // --- ROOM LOBBY & READY SYSTEM ---

    function toggleReady() {
        const codeInput = document.getElementById('my-secret-code').value;
        if (codeInput.length !== 6) return alert("The code must be exactly 6 digits.");
        
        myData.code = codeInput;
        myData.ready = true;
        
        document.getElementById('ready-btn').innerText = "WAITING FOR OTHERS...";
        document.getElementById('ready-btn').disabled = true;
        document.getElementById('my-secret-code').disabled = true;

        if (isHost) {
            let self = players.find(p => p.id === myId);
            self.ready = true;
            broadcast({ type: 'PLAYER_LIST', list: players });
            updatePlayerListUI();
            checkAllReady();
        } else {
            conn.send({ type: 'READY', id: myId, ready: true });
        }
    }

    function checkAllReady() {
        if (!isHost) return;
        if (players.length < 2) return; 
        
        const allReady = players.every(p => p.ready);
        if (allReady) {
            broadcast({ type: 'START_GAME', list: players });
            runGameStart();
        }
    }

    // --- GAME ENGINE ---

    function runGameStart() {
        initAudio(); // Initialize audio context on player interaction
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('chat-container').classList.remove('hidden');
        
        document.getElementById('show-my-code').innerText = myData.code;
        myData.eliminated = false;
        
        // Start playing audio track if loaded
        const bgAudio = document.getElementById('bg-music');
        if(bgAudio.src && bgAudio.src !== window.location.href) {
            bgAudio.play().catch(e => console.log("Audio presentation blocked by browser policies", e));
        }

        renderRivals();
    }

    function renderRivals() {
        const list = document.getElementById('rivals-list');
        list.innerHTML = '';
        players.forEach(p => {
            if (p.id === myId) return;
            const div = document.createElement('div');
            div.id = `player-${p.id}`;
            div.className = 'rival-card card';
            div.innerHTML = `
                <p><strong>${p.name}</strong></p>
                <input type="text" id="guess-${p.id}" maxlength="6" pattern="\\d{6}" placeholder="CODE" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <button onclick="sendGuess('${p.id}')">HACK</button>
                <div id="feedback-${p.id}" class="feedback-table"></div> `;
            list.appendChild(div);
        });
    }

    function sendGuess(targetId) {
        sfxHack();
        if (myData.eliminated) return alert("You are eliminated, you cannot hack.");
        
        const guessInput = document.getElementById(`guess-${targetId}`);
        const guess = guessInput.value;
        
        if (guess.length !== 6) return alert("You must guess with 6 digits.");

        if (isHost) {
            // Host sends request to client target through connection network
            let targetConn = connections.find(c => c.peer === targetId);
            if (targetConn) targetConn.send({ type: 'GUESS', from: myId, to: targetId, val: guess });
        } else {
            conn.send({ type: 'GUESS', from: myId, to: targetId, val: guess });
        }
        guessInput.value = '';
    }

    function handleFeedback(data) {
        // Play SFX according to correctness
        if (data.result.includes('✅')) sfxHit();
        else sfxMiss();

        const feedbackDiv = document.getElementById(`feedback-${data.from}`);
        if (feedbackDiv) {
            let row = document.createElement('div');
            row.className = 'feedback-row';
            row.innerText = `${data.guess} ➔ ${data.result.join('')}`;
            feedbackDiv.appendChild(row);
            feedbackDiv.scrollTop = feedbackDiv.scrollHeight; 
        }
    }

    function markEliminated(id) {
        let p = players.find(player => player.id === id);
        if (p) p.eliminated = true;

        const el = document.getElementById(`player-${id}`);
        if (el) {
            el.classList.add('eliminated');
            el.querySelector('button').disabled = true;
            el.querySelector('input').disabled = true;
        }
        
        if (id === myId) {
            document.getElementById('show-my-code').innerText += " (ELIMINATED)";
            document.getElementById('show-my-code').style.color = "red";
        }
    }

    function checkWinCondition() {
        if (!isHost) return;

        const activePlayers = players.filter(p => !p.eliminated);
        if (activePlayers.length === 1) {
            const winner = activePlayers[0];
            showVictory(winner.id, winner.name);
            broadcast({ type: 'GAME_OVER', winnerId: winner.id, winnerName: winner.name });
        } else if (activePlayers.length === 0) {
            showVictory(null, "Nobody");
            broadcast({ type: 'GAME_OVER', winnerId: null, winnerName: "Nobody" });
        }
    }

    function showVictory(winnerId, winnerName) {
        document.getElementById('bg-music').pause(); // Stop music stream
        sfxWin(); // Trigger victory fanfare

        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('victory-screen').classList.remove('hidden');
        
        const vicText = document.getElementById('victory-text');
        
        if (winnerId === myId) {
            vicText.innerText = "YOU ARE THE ULTIMATE HACKER! YOU WON!";
            addTrophy();
        } else {
            vicText.innerText = `THE WINNER IS: ${winnerName}`;
        }

        if (isHost) {
            document.getElementById('btn-play-again').classList.remove('hidden');
        }
    }

    function addTrophy() {
        trophies++;
        localStorage.setItem('hackTheCode_trophies', trophies);
        document.getElementById('trophy-count').innerText = trophies;
    }

    // --- RESTART GAME SESSION (Host Only) ---

    function playAgain() {
        if (!isHost) return;
        broadcast({ type: 'RESET' });
        resetToLobby();
    }

    function resetToLobby() {
        document.getElementById('victory-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('lobby').classList.remove('hidden');
        
        document.getElementById('my-secret-code').value = '';
        document.getElementById('my-secret-code').disabled = false;
        document.getElementById('ready-btn').innerText = "I AM READY";
        document.getElementById('ready-btn').disabled = false;
        document.getElementById('show-my-code').style.color = "white";
        document.getElementById('chat-box').innerHTML = '';

        myData.ready = false;
        myData.eliminated = false;
        players.forEach(p => {
            p.ready = false;
            p.eliminated = false;
        });

        updatePlayerListUI();
    }

    // --- UTILITY/HELPER FUNCTIONS ---

    function broadcast(data) {
        connections.forEach(c => c.send(data));
    }

    function updatePlayerListUI() {
        const list = document.getElementById('player-list');
        list.innerHTML = players.map(p => {
            let status = p.ready ? "<span class='ready-text'>[READY]</span>" : "[Waiting...]";
            return `<div>> ${p.name} ${status}</div>`;
        }).join('');
    }

    function addOrUpdatePlayer(newPlayer) {
        let existing = players.find(p => p.id === newPlayer.id);
        if (existing) {
            existing.name = newPlayer.name;
            existing.ready = newPlayer.ready;
        } else {
            players.push(newPlayer);
        }
        updatePlayerListUI();
    }

    function sendChatMessage() {
        const msg = document.getElementById('chat-input').value.trim();
        if (!msg) return;
        
        const data = { type: 'CHAT', name: myData.name, msg: msg };
        displayChat("You", msg);
        
        if (isHost) broadcast(data);
        else conn.send(data);
        
        document.getElementById('chat-input').value = '';
    }

    function displayChat(name, msg) {
        const box = document.getElementById('chat-box');
        box.innerHTML += `<div><strong>${name}:</strong> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
